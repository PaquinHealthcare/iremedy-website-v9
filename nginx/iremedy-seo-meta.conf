    sub_filter '<meta name="twitter:title" content="Healthcare Distribution &amp; Supply Chain Intelligence | iRemedy Healthcare">' '<meta name="twitter:title" content="Wholesale Distribution &amp; API Supply for Compounding Pharmacies | iRemedy Healthcare">';
