    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://iremedy.com/"},{"@type":"ListItem","position":2,"name":"Pharmacies","item":"https://iremedy.com/pharmacies"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does iRemedy supply GLP-1 APIs for compounding?","acceptedAnswer":{"@type":"Answer","text":"Yes. iRemedy supplies Tirzepatide, Semaglutide, and other GLP-1 agonist APIs for compounding under 503A and 503B. All GLP-1 APIs are sourced from FDA-registered, Green List manufacturers, and iRemedy serves as the U.S. Importer of Record. Full certificate of analysis, lot documentation, and import records are provided with every order."}},{"@type":"Question","name":"How does iRemedy verify API source credentialing?","acceptedAnswer":{"@type":"Answer","text":"For every API - especially GLP-1s and peptides - iRemedy verifies the manufacturer&#39;s FDA registration (FEI number), Green List status under relevant Import Alerts, cGMP inspection history, and lot-specific certificate of analysis. iRemedy is named as U.S. Importer of Record on customs documentation, meaning the regulatory chain of custody runs through us, not through an offshore broker."}},{"@type":"Question","name":"What cold chain capabilities does iRemedy have for peptides?","acceptedAnswer":{"@type":"Answer","text":"All peptide and temperature-sensitive APIs are stored and shipped through UPS Healthcare&#39;s pharma-grade cold chain network. This includes ambient, refrigerated (2-8\\u00b0C), frozen (-20\\u00b0C), and ultra-cold environments with continuous monitoring and documentation. This is validated pharmaceutical logistics - not consumer-grade courier."}},{"@type":"Question","name":"Can independent pharmacies buy from iRemedy without volume minimums?","acceptedAnswer":{"@type":"Answer","text":"Yes. iRemedy does not impose the volume minimums that traditional wholesalers require. The platform and pricing are accessible to single-location independents and multi-site operations alike."}},{"@type":"Question","name":"Is iRemedy a wholesale distributor or a broker?","acceptedAnswer":{"@type":"Answer","text":"iRemedy is a licensed wholesale distributor - NABP accredited, licensed in all 50 states, and DSCSA compliant. We are not a broker. Products are warehoused, handled, and shipped through our own licensed infrastructure powered by UPS Healthcare."}},{"@type":"Question","name":"Does iRemedy distribute controlled substances?","acceptedAnswer":{"@type":"Answer","text":"Yes. iRemedy distributes Schedule II through V controlled substances. All controlled substance orders include full DSCSA serialization and chain-of-custody documentation."}},{"@type":"Question","name":"What is the peptides.iremedy.com site?","acceptedAnswer":{"@type":"Answer","text":"iRemedy is developing a dedicated peptide distribution hub and education platform at peptides.iremedy.com - featuring detailed API product information, regulatory guidance, clinical protocol resources, and direct ordering for compounding pharmacies. Contact our compounding team for early access."}}]}</script></head>';
