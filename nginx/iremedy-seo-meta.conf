# ===== Server-side meta tag injection for SPA pages =====
# Replaces homepage meta tags with page-specific values via sub_filter
# so non-JS crawlers (LinkedIn, Twitter, AI tools) see correct metadata.
#
# NOTE: /essential-medicines is excluded because it has its own standalone
# HTML file (essential-medicines.html) with proper meta tags already.
# Peptide pages (/peptides/*) are also standalone HTML files.

# -- manufacturers --
location = /manufacturers {
    sub_filter_once off;
    sub_filter '<title>Healthcare Distribution &amp; Supply Chain Intelligence | iRemedy Healthcare</title>' '<title>U.S. Distribution for Manufacturers &mdash; Incubator &amp; DaaS Programs | iRemedy Healthcare</title>';
    sub_filter '<meta name="description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta name="description" content="Enter U.S. healthcare distribution in weeks, not months. iRemedy&#39;s Incubator and DaaS programs provide licensing, logistics, compliance, technology, and fulfillment via UPS Healthcare.">';
    sub_filter '<link rel="canonical" href="https://iremedy.com/">' '<link rel="canonical" href="https://iremedy.com/manufacturers">';
    sub_filter '<meta property="og:title" content="Healthcare Distribution &amp; Supply Chain Intelligence | iRemedy Healthcare">' '<meta property="og:title" content="U.S. Distribution for Manufacturers &mdash; Incubator &amp; DaaS Programs | iRemedy Healthcare">';
    sub_filter '<meta property="og:description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta property="og:description" content="Enter U.S. healthcare distribution in weeks, not months. iRemedy&#39;s Incubator and DaaS programs provide licensing, logistics, compliance, technology, and fulfillment via UPS Healthcare.">';
    sub_filter '<meta property="og:url" content="https://iremedy.com/">' '<meta property="og:url" content="https://iremedy.com/manufacturers">';
    sub_filter '<meta name="twitter:title" content="Healthcare Distribution &amp; Supply Chain Intelligence | iRemedy Healthcare">' '<meta name="twitter:title" content="U.S. Distribution for Manufacturers &mdash; Incubator &amp; DaaS Programs | iRemedy Healthcare">';
    sub_filter '<meta name="twitter:description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta name="twitter:description" content="Enter U.S. healthcare distribution in weeks, not months. iRemedy&#39;s Incubator and DaaS programs provide licensing, logistics, compliance, technology, and fulfillment via UPS Healthcare.">';
    rewrite ^ /index.html break;
}

