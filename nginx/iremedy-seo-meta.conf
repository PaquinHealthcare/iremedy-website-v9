    sub_filter '<meta property="og:description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta property="og:description" content="FDA-credentialed APIs, peptides, GLP-1 agonists, and wholesale pharmaceuticals for 503A/503B compounding pharmacies. Green List sourced. UPS Healthcare cold chain logistics.">';
