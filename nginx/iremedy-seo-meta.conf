    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://iremedy.com/"},{"@type":"ListItem","position":2,"name":"Government","item":"https://iremedy.com/government"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is TradeSpy?","acceptedAnswer":{"@type":"Answer","text":"TradeSpy is iRemedy&#39;s autonomous supply chain intelligence platform. It continuously verifies the true country of origin for pharmaceutical products sold in the United States, mapping actual API manufacturing locations against FDA labeler records. TradeSpy currently monitors over 129,000 NDCs and identifies CCP-controlled supply chain exposure, geopolitical transit risk, and domestic American-made alternatives."}},{"@type":"Question","name":"How does iRemedy support Buy American Act compliance?","acceptedAnswer":{"@type":"Answer","text":"Through TradeSpy, iRemedy provides product-level country-of-origin verification - including API manufacturing location, not just finished dosage form assembly. This supports BAA, TAA, and Berry Amendment compliance verification at a granularity that existing procurement systems don&#39;t provide. The Made in America Portfolio offers a curated catalog of verified domestic products."}},{"@type":"Question","name":"What was iRemedy&#39;s role in Operation Warp Speed?","acceptedAnswer":{"@type":"Answer","text":"iRemedy delivered over 500 million needles and syringes under federal contract during Operation Warp Speed. One in every two doses of the COVID-19 vaccine was administered using iRemedy-supplied product. The operation involved multi-continent air freight coordination, customs management, and last-mile delivery to vaccination sites nationwide."}},{"@type":"Question","name":"Can federal agencies use iRemedy for pharmaceutical procurement?","acceptedAnswer":{"@type":"Answer","text":"Yes. iRemedy is a licensed wholesale distributor - NABP accredited, DSCSA compliant, licensed in all 50 states. Federal agencies including VA, DoD, DLA, and HHS can procure pharmaceuticals, biologics, medical devices, and supplies through iRemedy&#39;s distribution infrastructure."}},{"@type":"Question","name":"What is the Made in America Portfolio?","acceptedAnswer":{"@type":"Answer","text":"The Made in America Portfolio is a curated catalog of verified American-made medical products available through iRemedy&#39;s single distribution and procurement relationship. It eliminates the operational complexity of sourcing from dozens of small domestic manufacturers by consolidating them into one contract, one onboarding, and one invoicing relationship - making Buy American procurement operationally viable."}},{"@type":"Question","name":"How does iRemedy make domestic manufacturing price-competitive?","acceptedAnswer":{"@type":"Answer","text":"iRemedy&#39;s direct distribution model removes the multi-tier markup stack that globalized distribution chains created - importers, national wholesalers, regional distributors, and GPO fee layers that add 15-30%+ in cost. By distributing American-made products directly from the manufacturer to the buyer, iRemedy closes the price gap without requiring federal subsidies to do all the work."}}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","speakable":{"@type":"SpeakableSpecification","cssSelector":[".pg-title",".faq-ans"]}}</script></head>';
