    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://iremedy.com/"},{"@type":"ListItem","position":2,"name":"Manufacturers","item":"https://iremedy.com/manufacturers"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How much does the Incubator program cost?","acceptedAnswer":{"@type":"Answer","text":"The Incubator program is priced at $5,000-$15,000 per month depending on product complexity, storage requirements, and volume. Additional fees may apply for special handling, custom packaging, or international freight. We provide a detailed proposal before any commitment."}},{"@type":"Question","name":"How long does onboarding take?","acceptedAnswer":{"@type":"Answer","text":"Typical onboarding is 2-6 weeks from signed agreement to first shipment. MetaCommerceRx platform integration is typically live within 2-4 weeks."}},{"@type":"Question","name":"What&#39;s the difference between the Incubator and DaaS?","acceptedAnswer":{"@type":"Answer","text":"The Incubator is the full-stack solution - warehousing, fulfillment, licensing, compliance, technology, and distribution all managed by iRemedy. DaaS (Distributor-as-a-Service) is a lighter-touch model where iRemedy acts as the licensed seller-of-record while you maintain direct customer relationships. DaaS is best for manufacturers who already have customers but need regulatory coverage."}},{"@type":"Question","name":"What types of products can iRemedy distribute?","acceptedAnswer":{"@type":"Answer","text":"Pharmaceuticals (branded, generic, specialty), biologics including IVIG, medical devices, med-surg supplies, and controlled substances (DEA Schedule II-V). We handle ambient, refrigerated, frozen, and ultra-cold storage environments."}},{"@type":"Question","name":"Do I need my own U.S. licenses?","acceptedAnswer":{"@type":"Answer","text":"No. In the Incubator model, iRemedy holds all required federal and state licenses. In the DaaS model, iRemedy acts as seller-of-record under our license stack. Either way, you don&#39;t need to build your own."}},{"@type":"Question","name":"Can I keep my own customer relationships?","acceptedAnswer":{"@type":"Answer","text":"Yes. In the DaaS model, you maintain all customer relationships and pricing. In the Incubator model, customers can order through your branded portal powered by MetaCommerceRx."}},{"@type":"Question","name":"What happens after the initial 12-month term?","acceptedAnswer":{"@type":"Answer","text":"Agreements renew by mutual consent. Many Incubator clients grow into direct UPS Healthcare accounts over time - the Incubator is designed as a bridge to enterprise-scale operations, not a permanent dependency."}}]}</script></head>';
    rewrite ^ /index.html break;
}

