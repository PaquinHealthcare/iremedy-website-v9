    sub_filter '<meta property="og:description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta property="og:description" content="Buy pharmaceuticals direct from the manufacturer with transparent pricing. No GPO required. DSCSA serialization, 50-state licensed distribution powered by UPS Healthcare.">';
