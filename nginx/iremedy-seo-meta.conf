    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://iremedy.com/"},{"@type":"ListItem","position":2,"name":"Providers","item":"https://iremedy.com/providers"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How does iRemedy pricing compare to GPO pricing?","acceptedAnswer":{"@type":"Answer","text":"iRemedy provides transparent, manufacturer-direct pricing without rebate layers or hidden distribution markups. For many product categories - particularly specialty pharmaceuticals, compounding ingredients, and non-contract items - iRemedy pricing is meaningfully lower than GPO-contracted pricing because there are fewer intermediaries adding cost. We encourage buyers to compare directly."}},{"@type":"Question","name":"Can I use iRemedy alongside my existing GPO?","acceptedAnswer":{"@type":"Answer","text":"Yes. Most providers use iRemedy as a secondary or parallel channel - for non-contract items, backfill during shortages, or categories where iRemedy pricing is more competitive. There&#39;s no membership fee and no exclusivity requirement."}},{"@type":"Question","name":"What products does iRemedy carry?","acceptedAnswer":{"@type":"Answer","text":"Pharmaceuticals (branded, generic, specialty), biologics including IVIG, medical devices, med-surg supplies, and DEA Schedule II-V controlled substances. The catalog includes over 1 million products through MetaCommerceRx."}},{"@type":"Question","name":"How does ordering work?","acceptedAnswer":{"@type":"Answer","text":"Orders are placed through MetaCommerceRx - iRemedy&#39;s online procurement platform. You can also integrate with your existing ERP or ordering system via API. Orders are fulfilled through UPS Healthcare and delivered in 1-2 business days to most U.S. locations."}},{"@type":"Question","name":"Is iRemedy DSCSA compliant?","acceptedAnswer":{"@type":"Answer","text":"Yes. Every transaction includes full DSCSA serialization - transaction history, transaction statement, and transaction information. Compliance is built into the platform, not added as a manual step."}},{"@type":"Question","name":"What are the minimum order requirements?","acceptedAnswer":{"@type":"Answer","text":"iRemedy does not impose the volume minimums that traditional distributors require. Whether you&#39;re a multi-site health system or an independent clinic, the platform and pricing are accessible."}},{"@type":"Question","name":"How do I verify country of origin for products?","acceptedAnswer":{"@type":"Answer","text":"Through TradeSpy integration, every product in the iRemedy catalog includes verified country-of-origin data for both the finished dosage form and the active pharmaceutical ingredient. This is particularly relevant for facilities with Buy American requirements or internal sourcing policies."}}]}</script></head>';
    rewrite ^ /index.html break;
}

