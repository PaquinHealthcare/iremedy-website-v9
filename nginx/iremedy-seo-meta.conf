    sub_filter '<meta property="og:description" content="iRemedy delivers pharmaceuticals, biologics, and medical devices direct from manufacturers to hospitals, pharmacies, and government agencies. 50-state licensed, DSCSA compliant, powered by UPS Healthcare.">' '<meta property="og:description" content="Enter U.S. healthcare distribution in weeks, not months. iRemedy\u2019s Incubator and DaaS programs provide licensing, logistics, compliance, technology, and fulfillment via UPS Healthcare.">';
