    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://iremedy.com/"},{"@type":"ListItem","position":2,"name":"Platform","item":"https://iremedy.com/platform"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is MetaCommerceRx proprietary software?","acceptedAnswer":{"@type":"Answer","text":"Yes. MetaCommerceRx is 100% custom code, owned entirely by iRemedy Healthcare. It is built on a Python/FastAPI backend with a React/TypeScript frontend. No third-party e-commerce platform or white-label system."}},{"@type":"Question","name":"How is the platform protected?","acceptedAnswer":{"@type":"Answer","text":"MetaCommerceRx is protected by 10 granted U.S. patents covering AI-driven procurement automation, catalog normalization, intelligent order routing, and digital agent technology. The patents were co-invented with Jim Harding, co-inventor of MS-DOS and Amazon Marketplace technology."}},{"@type":"Question","name":"How long does integration take?","acceptedAnswer":{"@type":"Answer","text":"For manufacturers joining the Incubator or DaaS program, MetaCommerceRx is typically configured and live within 2-4 weeks. Buyer-side integration depends on existing systems but typically takes 2-6 weeks for initial go-live with additional integrations added incrementally."}},{"@type":"Question","name":"What systems does MetaCommerceRx integrate with?","acceptedAnswer":{"@type":"Answer","text":"The platform integrates with ERP systems, CRM platforms, accounting systems, clinical systems, and external marketplaces via API and EDI. Direct integrations with UPS Healthcare logistics systems provide real-time inventory, shipment tracking, and serialization data."}},{"@type":"Question","name":"Can MetaCommerceRx handle controlled substances?","acceptedAnswer":{"@type":"Answer","text":"Yes. The platform includes built-in workflows for DEA Schedule II-V controlled substance ordering, including automated credential verification, ordering limits, and chain-of-custody documentation."}},{"@type":"Question","name":"How does the AI Meta.Agent technology work?","acceptedAnswer":{"@type":"Answer","text":"Meta.Agents are autonomous digital agents that retrieve, normalize, and cross-reference product data from external sources - including distributor catalogs, manufacturer databases, FDA records, and pricing feeds. They operate continuously, keeping the Universal Medical Products Catalog current without manual data entry."}}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"MetaCommerceRx","applicationCategory":"BusinessApplication","operatingSystem":"Web-based","description":"AI-powered healthcare procurement platform providing catalog normalization, compliance automation, intelligent order routing, and supply chain intelligence. Protected by 10 granted U.S. patents. Built on Python/FastAPI backend with React/TypeScript frontend.","creator":{"@id":"https://iremedy.com/#organization"},"offers":{"@type":"Offer","description":"Managed service \\u2014 configured for manufacturers and buyers. MVP go-live in 2-4 weeks."}}</script></head>';
