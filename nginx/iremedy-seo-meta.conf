# ===== Server-side meta tag + JSON-LD injection for SPA pages =====
# Replaces homepage meta tags with page-specific values AND injects
# JSON-LD structured data via sub_filter so non-JS crawlers see
# correct metadata and schemas in the raw HTML response.
#
# NOTE: /essential-medicines is excluded (standalone HTML file).
# Peptide pages (/peptides/*) are also standalone HTML files.

# -- home (FAQPage, WebPage) --
location = / {
    sub_filter_once off;
    sub_filter '</head>' '<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is iRemedy?","acceptedAnswer":{"@type":"Answer","text":"iRemedy Healthcare Companies is a technology-enabled healthcare distributor providing direct pharmaceutical and medical product distribution, AI-powered procurement intelligence, and supply chain transparency services. Founded in 2013, iRemedy is licensed in all 50 states, NABP accredited, and DSCSA compliant. Our logistics infrastructure is powered by UPS Healthcare."}},{"@type":"Question","name":"What products does iRemedy distribute?","acceptedAnswer":{"@type":"Answer","text":"iRemedy distributes pharmaceuticals (branded, generic, and specialty), biologics including IVIG, medical devices, med-surg supplies, and controlled substances. All products are distributed with full DSCSA serialization, transparent pricing, and auditable chain of custody."}},{"@type":"Question","name":"How is iRemedy different from traditional distributors like McKesson or Cardinal Health?","acceptedAnswer":{"@type":"Answer","text":"iRemedy provides direct manufacturer-to-provider distribution without the GPO markup layers, rebate complexity, or pricing opacity that define legacy distribution. Our AI-powered platform (MetaCommerceRx) automates license verification, catalog normalization, and compliance - and our TradeSpy intelligence engine provides country-of-origin verification that traditional distributors don&#39;t offer."}},{"@type":"Question","name":"What is TradeSpy?","acceptedAnswer":{"@type":"Answer","text":"TradeSpy is iRemedy&#39;s autonomous supply chain intelligence platform. It continuously verifies the true country of origin for pharmaceutical products sold in the United States, mapping actual API manufacturing locations against FDA labeler records. TradeSpy currently monitors over 129,000 NDCs and identifies foreign adversary exposure, supply chain concentration risk, and domestic American-made alternatives."}},{"@type":"Question","name":"What is the iRemedy Incubator?","acceptedAnswer":{"@type":"Answer","text":"The Incubator program provides emerging medical product companies with a complete U.S. market entry solution - warehousing, fulfillment, licensing, compliance, technology, and distribution - as a single managed service powered by UPS Healthcare infrastructure. It compresses market entry from 12-18 months to weeks."}},{"@type":"Question","name":"Who does iRemedy work with?","acceptedAnswer":{"@type":"Answer","text":"iRemedy serves hospitals and health systems, 503A and 503B compounding pharmacies, independent pharmacies, clinical providers, government agencies (federal and state), and medical product manufacturers entering or expanding within U.S. distribution."}},{"@type":"Question","name":"Is iRemedy&#39;s technology patented?","acceptedAnswer":{"@type":"Answer","text":"Yes. iRemedy holds 10 granted U.S. patents covering AI-driven supply chain automation, catalog normalization, and procurement intelligence, co-invented with Jim Harding - a co-inventor of MS-DOS and Amazon Marketplace technology."}},{"@type":"Question","name":"How does iRemedy help detect supply chain fraud?","acceptedAnswer":{"@type":"Answer","text":"iRemedy&#39;s TradeSpy platform autonomously cross-references manufacturer claims against FDA facility data, import records, and inspection histories to identify discrepancies that indicate counterfeit products, misrepresented country of origin, phantom manufacturers, and quality documentation fraud. iRemedy&#39;s direct distribution model also eliminates the opaque intermediary layers where pricing fraud and product substitution typically occur."}}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","speakable":{"@type":"SpeakableSpecification","cssSelector":[".panel-headline","details > p"]}}</script></head>';
    rewrite ^ /index.html break;
}

