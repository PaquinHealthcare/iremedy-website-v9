# ===== Content site: iremedy.com =====
server {
    server_name iremedy.com www.iremedy.com;

    root /var/www/iremedy.com;
    index index.html;

    # Legacy page redirects (SEO Phase 1)
    location = /solutions/direct { return 301 /providers; }
    location = /solutions/technology { return 301 /platform; }
    location = /solutions/logistics { return 301 /manufacturers; }
    location = /solutions/incubator { return 301 /manufacturers; }

    # ===== Server-side meta tag injection for SPA pages =====
    # Each location block serves index.html with page-specific meta tags
    # replaced via sub_filter so non-JS crawlers see correct metadata.

    include /etc/nginx/snippets/iremedy-seo-meta.conf;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/iremedy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/iremedy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.iremedy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = iremedy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name iremedy.com www.iremedy.com;
    return 404; # managed by Certbot




}
